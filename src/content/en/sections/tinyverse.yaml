# ---------------------------------------------------------------------------
# DRAFT COPY NOTICE
#
# `header.description` and `hint` were drafted from Salvatore's own framing of
# the Tinyverse ("demonstrative, kept low-scaled on purpose, they COULD scale
# up") by someone who is not Salvatore. No claim here is measured: no user
# counts, no outcomes, no dates. Still worth a read-through and an edit before
# it represents him.
#
# `items[].summary` for tiny-medleys is Salvatore's own wording, unedited.
# ---------------------------------------------------------------------------

header:
  title: Tinyverse
  description: My playground. When an idea will not leave me alone I build it end to end, ship it, and leave it running.

# Sits under the header, above the orbit. Names both affordances.
hint: Drag to spin the system, or pick a planet

# The thesis of the word "Tiny". Sits beside the system, not inside the header,
# so the graphic is the first thing read.
thesis: Small is the point. Each one could scale, and stays tiny so it costs nothing to host and I can start the next one tomorrow.

# Adding an app is adding an entry here. Orbit radius, angular phase, orbital
# speed and the SVG geometry are all derived from this list's length.
#   id      the slug, used by the ?tiny= deep link
#   host    shown as authenticating detail, in mono
#   stack   optional, omit rather than guess
items:
  - id: tiny-medleys
    name: Tiny Medleys
    summary: Create your medleys from chords progressions
    host: tinymedleys.salvatorecirone.dev
    url: https://tinymedleys.salvatorecirone.dev